name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Byte-compile
        run: python -m compileall -q src tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          # One Python per non-Linux runner is enough to catch platform issues.
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # FFmpeg is Resumex's only hard runtime dependency. Installing it here
      # lets the integration test render and probe a real MP4; without it those
      # tests skip themselves and the rest of the suite still runs.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Test
        run: pytest -v

      - name: End-to-end demo
        run: |
          resumex --help
          python -m resumex --version
          resumex -w ci-workspace doctor
          resumex -w ci-workspace demo
          python -m resumex -w ci-workspace stats

      - name: Check the demo really is a 9:16 H.264 video
        shell: bash
        run: |
          set -euo pipefail
          out=ci-workspace/demo_output/resumex-demo.mp4
          test -s "$out"

          # One field per call: ffprobe emits csv fields in its own order, not
          # the order they are asked for, so a combined query is unparseable.
          probe() { ffprobe -v error -of default=noprint_wrappers=1:nokey=1 "$@" "$out"; }
          width=$(probe   -select_streams v:0 -show_entries stream=width)
          height=$(probe  -select_streams v:0 -show_entries stream=height)
          vcodec=$(probe  -select_streams v:0 -show_entries stream=codec_name)
          acodec=$(probe  -select_streams a:0 -show_entries stream=codec_name)
          duration=$(probe -show_entries format=duration)

          echo "geometry=${width}x${height} video=${vcodec} audio=${acodec} duration=${duration}"
          test "$width"  = "1080"
          test "$height" = "1920"
          test "$vcodec" = "h264"
          test "$acodec" = "aac"
          awk -v d="$duration" 'BEGIN { exit !(d > 1) }'

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip build twine
      - name: Build the wheel and sdist
        run: python -m build
      - name: Check the distribution metadata
        run: twine check dist/*
      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/resumex --version
          /tmp/clean/bin/resumex --help
