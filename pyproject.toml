[project]
name = "resumex"
version = "0.1.0"
description = "Local-first pipeline that turns text stories into polished short-form videos."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olwtelet" }]
keywords = ["video", "shorts", "tts", "captions", "ffmpeg", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
tts = ["kokoro>=0.9.4", "soundfile>=0.12", "numpy>=1.24"]
youtube = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.2",
]
all = ["resumex[tts,youtube]"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[project.scripts]
resumex = "resumex.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumex"]

[tool.hatch.build.targets.sdist]
include = ["src/resumex", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that shell out to ffmpeg or touch optional providers",
]
